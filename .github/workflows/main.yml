name: GenerateBuilds

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-port-o2r:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dependencies
      run: sudo apt-get install gcc g++ git cmake ninja-build lsb-release
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.13
      with:
        key: ${{ runner.os }}-o2r-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-ccache-${{ github.ref }}
          ${{ runner.os }}-o2r-ccache-
    - name: Cache build folders
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-o2r-build-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-build-${{ github.ref }}
          ${{ runner.os }}-o2r-build-
        path: |
          tools/Torch/cmake-build-release
    - name: Generate starship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        make -C tools/Torch type=release -j3
        tools/Torch/cmake-build-release/torch pack port starship.o2r o2r
    - uses: actions/upload-artifact@v4
      with:
        name: starship.o2r
        path: starship.o2r
        retention-days: 1

  package-apworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated Archipelago IDs are up to date
        run: python3 tools/ap_gen_ids.py --check
      - name: Package apworld
        run: python3 tools/ap_package_apworld.py star_fox_64_ss.apworld
      - name: Upload apworld
        uses: actions/upload-artifact@v4
        with:
          name: star_fox_64_ss.apworld
          path: star_fox_64_ss.apworld
          retention-days: 1

  test-apworld:
    runs-on: ubuntu-latest
    env:
      ARCHIPELAGO_DIR: ${{ github.workspace }}/archipelago
    steps:
      - uses: actions/checkout@v4
      - name: Check out Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: "0.6.7"
          path: archipelago
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: archipelago/requirements.txt
      - name: Install Archipelago requirements
        run: pip install -r archipelago/requirements.txt
      - name: Package apworld into Archipelago
        run: |
          mkdir -p "$ARCHIPELAGO_DIR/custom_worlds"
          python tools/ap_package_apworld.py "$ARCHIPELAGO_DIR/custom_worlds/star_fox_64_ss.apworld"
      - name: World logic tests
        working-directory: archipelago
        run: python -m unittest -v worlds.star_fox_64_ss.test.test_logic
      - name: Generate player options template
        working-directory: archipelago
        run: python -c "import Options; Options.generate_yaml_templates('templates', False)"
      - name: Upload player options template
        uses: actions/upload-artifact@v4
        with:
          name: star_fox_64_ss-template.yaml
          path: archipelago/templates/Star Fox 64 (Starship).yaml
          if-no-files-found: error
          retention-days: 1
      - name: Compiled C logic matches the Python rules
        run: python tools/ap_logic_test/difftest.py

  build-windows:
    needs: generate-port-o2r
    runs-on: windows-2022
    env:
      # Pinned so vcpkg ABI hashes stay stable and the binary cache actually hits; bump to update deps.
      VCPKG_TAG: 2026.07.29
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Clone vcpkg
        run: git clone --quiet --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_TAG }}-
          restore-keys: vcpkg-x64-windows-static-${{ env.VCPKG_TAG }}-
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows # shared with windows.yml so PR runs can reuse main's cache
          max-size: 2G
      - name: Build
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          # -D because msvc-dev-cmd overwrites env VCPKG_ROOT with VS's bundled (non-git) vcpkg
          cmake -S . -B "build/x64" -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCPKG_ROOT="${{ github.workspace }}\vcpkg"
          # Skip TorchExternal (standalone asset tool, unused here; Torch is already built into Starship)
          cmake --build ./build/x64 --target Starship
      # Keyed on content: saves only when vcpkg built something new (e.g. after a runner compiler update)
      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-matched-key != format('vcpkg-x64-windows-static-{0}-{1}', env.VCPKG_TAG, hashFiles('vcpkg-binary-cache/**'))
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg-binary-cache/**') }}
      - name: Download starship.o2r
        uses: actions/download-artifact@v4
        with:
          name: starship.o2r
          path: ./build/x64
      - name: Create Package
        run: |
          mkdir starship-release
          mv build/x64/Starship.exe starship-release/
          mv build/x64/starship.o2r starship-release/
          mv config.yml starship-release/
          mv assets starship-release/
          mv networking starship-release/networking
          cp THIRD_PARTY_NOTICES.md starship-release/
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt" -OutFile "starship-release/gamecontrollerdb.txt"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: starship-windows
          path: starship-release

  build-macos:
    needs: generate-port-o2r
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: melusina-org/setup-macports@v1
        with:
          parameters: '.github/macports.yml'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos # ccache-macos
      - name: Build
        run: |
          cmake -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build build-cmake -j
      - name: Download starship.o2r
        uses: actions/download-artifact@v4
        with:
          name: starship.o2r
          path: ./build-cmake
      - name: Create Package
        run: |
          (cd build-cmake && cpack)
          mv _packages/*.dmg Starship.dmg
          mv README.md readme.txt
      - name: Publish packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Starship-mac
          path: |
            Starship.dmg
            readme.txt
            THIRD_PARTY_NOTICES.md

  build-linux:
    needs: generate-port-o2r
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update machine
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt-get install gcc g++ git cmake ninja-build lsb-release libsdl2-dev libpng-dev libsdl2-net-dev libzip-dev zipcmp zipmerge ziptool nlohmann-json3-dev libtinyxml2-dev libspdlog-dev libboost-dev libopengl-dev libogg-dev libvorbis-dev libssl-dev zlib1g-dev
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: linux-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-${{ github.ref }}
            linux-ccache-
      - name: Cache build folders
        uses: actions/cache@v4
        with:
          key: linux-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            linux-build-${{ github.ref }}
            linux-build-
          path: |
            SDL2-2.30.3
            tinyxml2-10.0.0
            libzip-1.10.1
      - name: Install latest SDL
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ ! -d "SDL2-2.30.3" ]; then
            wget https://www.libsdl.org/release/SDL2-2.30.3.tar.gz
            tar -xzf SDL2-2.30.3.tar.gz
          fi
          cd SDL2-2.30.3
          ./configure --enable-hidapi-libusb
          make -j 10
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
      - name: Install latest tinyxml2
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz
          cd tinyxml2-10.0.0
          mkdir -p build
          cd build
          cmake ..
          make
          sudo make install
      - name: Install libzip without crypto
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ ! -d "libzip-1.10.1" ]; then
            wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
            tar -xzf libzip-1.10.1.tar.gz
          fi
          cd libzip-1.10.1
          mkdir -p build
          cd build
          cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
          make
          sudo make install
          sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
      - name: Download starship.o2r
        uses: actions/download-artifact@v4
        with:
          name: starship.o2r
          path: ./build-cmake
      - name: Build
        run: |
          cmake -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-cmake --config Release -j3
          (cd build-cmake && cpack -G External)
          wget -O gamecontrollerdb.txt https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt
          mv README.md readme.txt
          mv build-cmake/*.appimage starship.appimage
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Starship-linux
          path: |
            starship.appimage
            THIRD_PARTY_NOTICES.md
            config.yml
            assets
            gamecontrollerdb.txt

  # On a tag push: collect every build into a draft GitHub release named after the tag (publish it by hand).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-apworld, test-apworld, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          v="$GITHUB_REF_NAME"
          mkdir release
          cp artifacts/star_fox_64_ss.apworld/star_fox_64_ss.apworld release/
          cp "artifacts/star_fox_64_ss-template.yaml/Star Fox 64 (Starship).yaml" "release/Starship_${v}_Default_Template.yaml"
          chmod +x artifacts/Starship-linux/starship.appimage  # artifacts do not keep file modes
          for platform in Linux:Starship-linux Mac:Starship-mac Windows:starship-windows; do
            (cd "artifacts/${platform#*:}" && zip -qr "../../release/Starship_Archipelago_${v}_${platform%%:*}.zip" .)
          done
          ls -l release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
